dataset:
  database:
    backend:
      type: none
  max_runner_concurrency: 1
  cpu_runner_url: null
  gpu_runner_url: null
  registry:
    - module_path: sandbox.datasets.live_code_bench
      class_name: LiveCodeBenchDataset
      dataset_tables:
        live_code_bench_v1: code_eval_live_code_bench_v1
sandbox:
