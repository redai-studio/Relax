# Four rollout GPUs: one prefill and one decode engine, each TP2.
# CPU HiCache belongs to prefill; SGLang sizes KV and Mamba pools from memory.
sglang:
  - name: default
    num_gpus_per_engine: 2
    engine_groups:
      - worker_type: prefill
        num_gpus: 2
        overrides:
          mamba_radix_cache_strategy: extra_buffer
          mamba_full_memory_ratio: 0.2
          mamba_track_interval: 256
          chunked_prefill_size: 16384
          page_size: 64
          enable_hierarchical_cache: true
          hicache_ratio: 2.0
          hicache_size: 0
          hicache_write_policy: write_through
          hicache_io_backend: direct
          hicache_mem_layout: page_first_direct
          hicache_storage_backend: null
      - worker_type: decode
        num_gpus: 2
        overrides:
          mamba_radix_cache_strategy: extra_buffer
          mamba_full_memory_ratio: 0.05
          mamba_track_interval: 256
          page_size: 64
          enable_hierarchical_cache: false
          hicache_storage_backend: null
          disaggregation_decode_enable_radix_cache: false
