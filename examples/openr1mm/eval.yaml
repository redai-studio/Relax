eval:
  datasets:
    - name: mathvista_testmini_disjoint_local_accuracy
      path: ${oc.env:DATA_DIR}/openr1mm-eval/mathvista_testmini_disjoint.parquet
      input_key: prompt
      label_key: label
      temperature: 0
      top_p: 1
      top_k: -1
      n_samples_per_eval_prompt: 1
      max_response_len: 8192
      metadata_overrides:
        eval_benchmark: mathvista_testmini
    - name: mmmu_validation_disjoint_local_accuracy
      path: ${oc.env:DATA_DIR}/openr1mm-eval/mmmu_validation_disjoint.parquet
      input_key: prompt
      label_key: label
      temperature: 0
      top_p: 1
      top_k: -1
      n_samples_per_eval_prompt: 1
      max_response_len: 8192
      metadata_overrides:
        eval_benchmark: mmmu_validation
