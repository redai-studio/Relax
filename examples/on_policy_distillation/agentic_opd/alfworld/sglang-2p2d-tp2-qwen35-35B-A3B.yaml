# 8-GPU colocated rollout: 2 P x TP2 + 2 D x TP2; all engines EP1.
# Context length and max-running-requests inherit the launch script values.
# Memory saver, weight backup and disabled prefill CUDA Graph inherit from Relax.
sglang:
  - name: default
    num_gpus_per_engine: 2
    engine_groups:
    - worker_type: prefill
      num_gpus: 4
      overrides:
        mamba_radix_cache_strategy: extra_buffer
        chunked_prefill_size: 8192
        cuda_graph_max_bs_decode: 160
        mem_fraction_static: 0.80
    - worker_type: decode
      num_gpus: 4
      overrides:
        mamba_radix_cache_strategy: extra_buffer
        chunked_prefill_size: 8192
        cuda_graph_max_bs_decode: 160
        mem_fraction_static: 0.70
