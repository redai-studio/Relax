eval:
  defaults:
    input_key: prompt
    label_key: label
    metadata_key: metadata
    custom_generate_function_path: examples.retool.rollout.generate
    n_samples_per_eval_prompt: 1
    temperature: 0
    top_p: 1
    top_k: -1
    max_response_len: 8192
  datasets:
    - name: gsm8k_tools
      path: ${oc.env:DATA_DIR}/eval/gsm8k.jsonl
      metadata_overrides: {tool_enabled: true}
    - name: gsm8k_direct
      path: ${oc.env:DATA_DIR}/eval/gsm8k.jsonl
      metadata_overrides: {tool_enabled: false}
    - name: gsmhard_tools
      path: ${oc.env:DATA_DIR}/eval/gsmhard.jsonl
      metadata_overrides: {tool_enabled: true}
    - name: gsmhard_direct
      path: ${oc.env:DATA_DIR}/eval/gsmhard.jsonl
      metadata_overrides: {tool_enabled: false}
    - name: math500_tools
      path: ${oc.env:DATA_DIR}/eval/math500.jsonl
      metadata_overrides: {tool_enabled: true}
    - name: math500_direct
      path: ${oc.env:DATA_DIR}/eval/math500.jsonl
      metadata_overrides: {tool_enabled: false}
    - name: aime2025_tools
      path: ${oc.env:DATA_DIR}/eval/aime2025.jsonl
      metadata_overrides: {tool_enabled: true}
    - name: aime2025_direct
      path: ${oc.env:DATA_DIR}/eval/aime2025.jsonl
      metadata_overrides: {tool_enabled: false}
    - name: aime2026_tools
      path: ${oc.env:DATA_DIR}/eval/aime2026.jsonl
      metadata_overrides: {tool_enabled: true}
    - name: aime2026_direct
      path: ${oc.env:DATA_DIR}/eval/aime2026.jsonl
      metadata_overrides: {tool_enabled: false}
