<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="partial_rollout-title partial_rollout-desc">
    <title id="partial_rollout-title">Request-level partial rollout</title>
    <desc id="partial_rollout-desc">Sequence showing one agent Chat Completions request interrupted at a rollout step boundary, parked with its partial token prefix, resumed with a new backend request ID, and returned as one response.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');

        .lifeline { stroke: rgba(31,31,35,.22); stroke-width: 1; stroke-dasharray: 4 4; }
        .activation { fill: rgba(79,111,191,.08); stroke: rgba(79,111,191,.55); stroke-width: .8; }
        .actor-mask { fill: #f7f7f8; }
        .actor { fill: #fff; stroke: #55565e; stroke-width: 1.2; }
        .actor-accent { fill: #fff0f2; stroke: #e8384a; stroke-width: 1.6; }
        .actor-name { fill: #1f1f23; font: 600 16px "Manrope", sans-serif; }
        .actor-sub { fill: #696a72; font: 500 12px "Inter", sans-serif; }
        .call { fill: none; stroke: #4f6fbf; stroke-width: 1.5; marker-end: url(#arrow-link); }
        .control { fill: none; stroke: #696a72; stroke-width: 1.4; marker-end: url(#arrow); }
        .return { fill: none; stroke: #696a72; stroke-width: 1.2; stroke-dasharray: 5 4; marker-end: url(#arrow); }
        .success { fill: none; stroke: #e8384a; stroke-width: 1.8; marker-end: url(#arrow-accent); }
        .label-mask { fill: #f7f7f8; }
        .label { fill: #55565e; font: 600 8px "Inter", sans-serif; letter-spacing: .06em; }
        .phase { fill: #74757c; font: 600 8px "Inter", sans-serif; letter-spacing: .14em; }
        .phase-rule { stroke: rgba(31,31,35,.14); stroke-width: .8; stroke-dasharray: 4 4; }
        .note { fill: #696a72; font: 500 12px "Inter", sans-serif; }
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#696a72"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f6fbf"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#e8384a"/></marker>
    </defs>

    <rect width="1280" height="720" fill="#f7f7f8"/>

    <!-- Lifelines and activations -->
    <line class="lifeline" x1="160" y1="144" x2="160" y2="664"/>
    <line class="lifeline" x1="480" y1="144" x2="480" y2="664"/>
    <line class="lifeline" x1="800" y1="144" x2="800" y2="664"/>
    <line class="lifeline" x1="1120" y1="144" x2="1120" y2="664"/>
    <rect class="activation" x="156" y="184" width="8" height="448"/>
    <rect class="activation" x="476" y="184" width="8" height="448"/>
    <rect class="activation" x="796" y="224" width="8" height="168"/>
    <rect class="activation" x="796" y="520" width="8" height="88"/>
    <rect class="activation" x="1116" y="272" width="8" height="216"/>

    <!-- Messages -->
    <line class="call" x1="164" y1="192" x2="476" y2="192"/>
    <rect class="label-mask" x="244" y="164" width="152" height="16" rx="2"/>
    <text class="label" x="320" y="176" text-anchor="middle">POST /CHAT/COMPLETIONS</text>

    <line class="call" x1="484" y1="232" x2="796" y2="232"/>
    <rect class="label-mask" x="576" y="204" width="128" height="16" rx="2"/>
    <text class="label" x="640" y="216" text-anchor="middle">GENERATE · RID:0</text>

    <line class="control" x1="1116" y1="280" x2="484" y2="280"/>
    <rect class="label-mask" x="712" y="252" width="176" height="16" rx="2"/>
    <text class="label" x="800" y="264" text-anchor="middle">STEP CLOSES GENERATION</text>

    <line class="control" x1="484" y1="328" x2="796" y2="328"/>
    <rect class="label-mask" x="580" y="300" width="120" height="16" rx="2"/>
    <text class="label" x="640" y="312" text-anchor="middle">ABORT · RID:0</text>

    <line class="return" x1="796" y1="376" x2="484" y2="376"/>
    <rect class="label-mask" x="568" y="388" width="144" height="16" rx="2"/>
    <text class="label" x="640" y="400" text-anchor="middle">PARTIAL TOKEN PREFIX</text>

    <path class="control" d="M484 424 H576 Q584 424 584 432 V448 Q584 456 576 456 H488"/>
    <rect class="label-mask" x="596" y="416" width="148" height="16" rx="2"/>
    <text class="label" x="670" y="428" text-anchor="middle">PARK IR · REQUEST WAITS</text>

    <line class="control" x1="1116" y1="480" x2="484" y2="480"/>
    <rect class="label-mask" x="728" y="452" width="144" height="16" rx="2"/>
    <text class="label" x="800" y="464" text-anchor="middle">NEXT STEP OPENS</text>

    <line class="call" x1="484" y1="528" x2="796" y2="528"/>
    <rect class="label-mask" x="536" y="500" width="208" height="16" rx="2"/>
    <text class="label" x="640" y="512" text-anchor="middle">RID:1 · PREFIX + REMAINING</text>

    <line class="return" x1="796" y1="576" x2="484" y2="576"/>
    <rect class="label-mask" x="584" y="588" width="112" height="16" rx="2"/>
    <text class="label" x="640" y="600" text-anchor="middle">FINAL TOKENS</text>

    <line class="success" x1="476" y1="624" x2="164" y2="624"/>
    <rect class="label-mask" x="232" y="596" width="176" height="16" rx="2"/>
    <text class="label" x="320" y="608" text-anchor="middle">SAME CHAT RESPONSE</text>

    <!-- Phase markers -->
    <line class="phase-rule" x1="40" y1="416" x2="1240" y2="416"/>
    <rect x="48" y="404" width="152" height="20" rx="2" fill="#f7f7f8"/>
    <text class="phase" x="124" y="418" text-anchor="middle">CROSS-STEP RETENTION</text>

    <!-- Actors drawn last -->
    <rect class="actor-mask" x="64" y="64" width="192" height="80" rx="8"/>
    <rect class="actor" x="64" y="64" width="192" height="80" rx="8"/>
    <text class="actor-name" x="160" y="100" text-anchor="middle">Agent App</text>
    <text class="actor-sub" x="160" y="124" text-anchor="middle">one HTTP request</text>

    <rect class="actor-mask" x="376" y="64" width="208" height="80" rx="8"/>
    <rect class="actor-accent" x="376" y="64" width="208" height="80" rx="8"/>
    <text class="actor-name" x="480" y="100" text-anchor="middle">Relax Runtime</text>
    <text class="actor-sub" x="480" y="124" text-anchor="middle">stable IR state</text>

    <rect class="actor-mask" x="704" y="64" width="192" height="80" rx="8"/>
    <rect class="actor" x="704" y="64" width="192" height="80" rx="8"/>
    <text class="actor-name" x="800" y="100" text-anchor="middle">SGLang</text>
    <text class="actor-sub" x="800" y="124" text-anchor="middle">backend attempts</text>

    <rect class="actor-mask" x="1024" y="64" width="192" height="80" rx="8"/>
    <rect class="actor" x="1024" y="64" width="192" height="80" rx="8"/>
    <text class="actor-name" x="1120" y="100" text-anchor="middle">Training</text>
    <text class="actor-sub" x="1120" y="124" text-anchor="middle">step boundary</text>

    <text class="note" x="1216" y="680" text-anchor="end">Only backend attempts change; the agent awaits one response.</text>
  </svg>
