<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="warmup-title warmup-desc">
    <title id="warmup-title">Agent process prelaunch across multiple turns</title>
    <desc id="warmup-desc">Two multi-turn timelines compare on-demand startup after a rollout step opens with prelaunch where the agent sends its first request early and Relax holds it until the same step boundary.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');

        .lane { fill: #fff; stroke: rgba(31,31,35,.14); stroke-width: 1; }
        .lane-title { fill: #1f1f23; font: 600 16px "Manrope", sans-serif; }
        .lane-sub { fill: #74757c; font: 500 12px "Inter", sans-serif; }
        .axis { stroke: #8b8c93; stroke-width: 1.2; }
        .boundary { stroke: #e8384a; stroke-width: 1.6; stroke-dasharray: 6 5; }
        .boundary-label { fill: #e8384a; font: 600 8px "Inter", sans-serif; letter-spacing: .1em; }
        .startup { fill: #fff0f2; stroke: #e8384a; stroke-width: 1.4; }
        .request { fill: #eef1f9; stroke: #4f6fbf; stroke-width: 1.2; }
        .response { fill: #f2f2f4; stroke: #8b8c93; stroke-width: 1; }
        .held { fill: rgba(79,111,191,.06); stroke: #4f6fbf; stroke-width: 1.2; stroke-dasharray: 5 4; }
        .phase-name { fill: #1f1f23; font: 600 12px "Manrope", sans-serif; }
        .phase-sub { fill: #696a72; font: 500 8px "Inter", sans-serif; letter-spacing: .04em; }
        .turn { fill: #74757c; font: 600 8px "Inter", sans-serif; letter-spacing: .1em; }
        .note { fill: #696a72; font: 500 12px "Inter", sans-serif; }
        .legend { fill: #696a72; font: 500 12px "Inter", sans-serif; }
        .eyebrow { fill: #74757c; font: 600 8px "Inter", sans-serif; letter-spacing: .16em; }
      </style>
    </defs>

    <rect width="1280" height="720" fill="#f7f7f8"/>

    <rect class="lane" x="40" y="104" width="1200" height="216" rx="8"/>
    <text class="lane-title" x="72" y="148">Without prelaunch</text>
    <text class="lane-sub" x="72" y="172">startup begins after the rollout step opens</text>
    <line class="axis" x1="200" y1="232" x2="1232" y2="232"/>

    <rect class="lane" x="40" y="352" width="1200" height="216" rx="8"/>
    <text class="lane-title" x="72" y="396">With prelaunch</text>
    <text class="lane-sub" x="72" y="420">the first request reaches Relax early and waits for the same step boundary</text>
    <line class="axis" x1="200" y1="480" x2="1232" y2="480"/>

    <!-- One boundary shared by both traces. -->
    <line class="boundary" x1="640" y1="56" x2="640" y2="600"/>
    <rect x="568" y="48" width="144" height="20" rx="2" fill="#f7f7f8"/>
    <text class="boundary-label" x="640" y="62" text-anchor="middle">ROLLOUT STEP OPENS</text>

    <!-- On-demand: startup is paid after the boundary, then the agent keeps turning. -->
    <rect class="startup" x="664" y="196" width="168" height="72" rx="6"/>
    <text class="phase-name" x="748" y="224" text-anchor="middle">Startup</text>
    <text class="phase-sub" x="748" y="244" text-anchor="middle">LAUNCH + INITIALIZE</text>

    <rect class="request" x="856" y="196" width="72" height="72" rx="6"/>
    <text class="phase-name" x="892" y="224" text-anchor="middle">Request 1</text>
    <text class="phase-sub" x="892" y="244" text-anchor="middle">CHAT</text>

    <rect class="response" x="944" y="196" width="88" height="72" rx="6"/>
    <text class="phase-name" x="988" y="224" text-anchor="middle">Response 1</text>
    <text class="phase-sub" x="988" y="244" text-anchor="middle">TOKENS</text>

    <rect class="request" x="1072" y="196" width="72" height="72" rx="6"/>
    <text class="phase-name" x="1108" y="224" text-anchor="middle">Request 2</text>
    <text class="phase-sub" x="1108" y="244" text-anchor="middle">CHAT</text>

    <rect class="response" x="1160" y="196" width="72" height="72" rx="6"/>
    <text class="phase-name" x="1196" y="224" text-anchor="middle">Response 2</text>
    <text class="phase-sub" x="1196" y="244" text-anchor="middle">TOKENS</text>

    <text class="turn" x="940" y="292" text-anchor="middle">TURN 1</text>
    <text class="turn" x="1148" y="292" text-anchor="middle">TOOL WORK → TURN 2</text>

    <!-- Prelaunch: request 1 exists before the boundary and is released exactly at it. -->
    <rect class="startup" x="224" y="444" width="168" height="72" rx="6"/>
    <text class="phase-name" x="308" y="472" text-anchor="middle">Startup</text>
    <text class="phase-sub" x="308" y="492" text-anchor="middle">LAUNCH + INITIALIZE</text>

    <rect class="request" x="416" y="444" width="80" height="72" rx="6"/>
    <text class="phase-name" x="456" y="472" text-anchor="middle">Request 1</text>
    <text class="phase-sub" x="456" y="492" text-anchor="middle">CHAT</text>

    <rect class="held" x="520" y="444" width="112" height="72" rx="6"/>
    <text class="phase-name" x="576" y="472" text-anchor="middle">Held</text>
    <text class="phase-sub" x="576" y="492" text-anchor="middle">REQUEST 1 WAITS</text>

    <rect class="response" x="664" y="444" width="88" height="72" rx="6"/>
    <text class="phase-name" x="708" y="472" text-anchor="middle">Response 1</text>
    <text class="phase-sub" x="708" y="492" text-anchor="middle">TOKENS</text>

    <rect class="request" x="824" y="444" width="72" height="72" rx="6"/>
    <text class="phase-name" x="860" y="472" text-anchor="middle">Request 2</text>
    <text class="phase-sub" x="860" y="492" text-anchor="middle">CHAT</text>

    <rect class="response" x="912" y="444" width="88" height="72" rx="6"/>
    <text class="phase-name" x="956" y="472" text-anchor="middle">Response 2</text>
    <text class="phase-sub" x="956" y="492" text-anchor="middle">TOKENS</text>

    <rect class="request" x="1056" y="444" width="72" height="72" rx="6"/>
    <text class="phase-name" x="1092" y="472" text-anchor="middle">Request 3</text>
    <text class="phase-sub" x="1092" y="492" text-anchor="middle">CHAT</text>

    <rect class="response" x="1144" y="444" width="88" height="72" rx="6"/>
    <text class="phase-name" x="1188" y="472" text-anchor="middle">Response 3</text>
    <text class="phase-sub" x="1188" y="492" text-anchor="middle">TOKENS</text>

    <text class="turn" x="624" y="540" text-anchor="end">TURN 1 STARTS BEFORE STEP</text>
    <text class="turn" x="788" y="540" text-anchor="middle">TOOL WORK</text>
    <text class="turn" x="1028" y="540" text-anchor="middle">TOOL WORK</text>

    <text class="note" x="1216" y="588" text-anchor="end">The held request is released at the boundary; later turns use the same agent loop.</text>

    <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(31,31,35,.12)" stroke-width=".8"/>
    <text class="eyebrow" x="48" y="664">LEGEND</text>
    <rect class="startup" x="152" y="648" width="20" height="20" rx="4"/>
    <text class="legend" x="188" y="664">agent startup</text>
    <rect class="request" x="344" y="648" width="20" height="20" rx="4"/>
    <text class="legend" x="380" y="664">Chat request</text>
    <rect class="held" x="520" y="648" width="20" height="20" rx="4"/>
    <text class="legend" x="556" y="664">request held by Relax</text>
    <rect class="response" x="760" y="648" width="20" height="20" rx="4"/>
    <text class="legend" x="796" y="664">model response</text>
    <text class="turn" x="1232" y="664" text-anchor="end">TIME →</text>
  </svg>
