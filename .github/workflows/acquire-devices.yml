name: Acquire Devices Action

on:
  pull_request:
    paths:
      - .github/actions/acquire-devices/**
      - .github/workflows/acquire-devices.yml
      - tests/actions/test_acquire_devices.py
  push:
    branches: [main]
    paths:
      - .github/actions/acquire-devices/**
      - .github/workflows/acquire-devices.yml
      - tests/actions/test_acquire_devices.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Exercise contention and lifecycle without GPUs
        run: python3 -m unittest discover -s tests/actions -p test_acquire_devices.py -v
      - name: Provide synthetic discovery for the runner lifecycle smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/device-bin"
          cat > "$RUNNER_TEMP/device-bin/nvidia-smi" <<'SCRIPT'
          #!/bin/sh
          echo '0, GPU-00000000-0000-0000-0000-000000000000, Disabled'
          SCRIPT
          chmod +x "$RUNNER_TEMP/device-bin/nvidia-smi"
          echo "$RUNNER_TEMP/device-bin" >> "$GITHUB_PATH"
      - uses: $/.github/actions/acquire-devices
        id: devices
        with:
          backend: nvidia
          count: 1
          timeout: 0
          lock-dir: ${{ runner.temp }}/device-smoke-locks
      - name: Check visibility in a later step
        env:
          RESERVED_DEVICES: ${{ steps.devices.outputs.devices }}
          RESERVED_COUNT: ${{ steps.devices.outputs.count }}
          LOCK_DIR: ${{ runner.temp }}/device-smoke-locks
        run: |
          test "$CUDA_VISIBLE_DEVICES" = "$RESERVED_DEVICES"
          test "$RESERVED_COUNT" = '1'
          test "$RESERVED_DEVICES" = 'GPU-00000000-0000-0000-0000-000000000000'
          python3 - <<'PY'
          import fcntl
          import os
          from pathlib import Path

          locks = list(Path(os.environ['LOCK_DIR']).glob('*.lock'))
          assert len(locks) == 1, locks
          with locks[0].open('a+') as handle:
              try:
                  fcntl.flock(handle, fcntl.LOCK_EX | fcntl.LOCK_NB)
              except BlockingIOError:
                  pass
              else:
                  raise AssertionError('Device lock was released between steps')
          PY
