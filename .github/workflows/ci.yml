name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bypass:
    name: Check CI bypass
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/check-bypass.yml
    with:
      target: ci

  # ── Pre-commit checks (ruff check/format, copyright, gitleaks, trailing-whitespace etc.) ──
  pre-commit:
    needs: bypass
    # A failed gate must run the tests, never grant an exemption.
    if: ${{ !cancelled() && (needs.bypass.result != 'success' || needs.bypass.outputs.can-skip != 'true') }}
    name: Pre-commit Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run prek
        uses: j178/prek-action@v3.0.0
