name: Welcome Contributors

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: pr-welcome-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  welcome:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/pr-welcome
        # The action must be merged into the default branch before it can welcome PRs.
        if: hashFiles('.github/actions/pr-welcome/action.yml') != ''
        with:
          bot-token: ${{ secrets.WELCOME_BOT_TOKEN }}
          bot-login: ${{ vars.WELCOME_BOT_LOGIN }}
