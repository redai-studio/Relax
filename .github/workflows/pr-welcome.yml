name: Welcome Contributors

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [Review Signal, CI, Unit Tests, Integration Tests]
    # PR events refresh new commits; manual CI reruns refresh only on completion.
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    # Reject non-PR upstream runs before allocating a runner or checking out code.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' &&
       contains(fromJSON('["pull_request", "pull_request_review"]'), github.event.workflow_run.event))
    runs-on: ubuntu-slim
    timeout-minutes: 3
    outputs:
      numbers: ${{ steps.prs.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        id: prs
        with:
          script: |
            const { pullRequestNumbers } = await import(`${process.env.GITHUB_WORKSPACE}/.github/actions/pr-welcome/index.mjs`);
            return await pullRequestNumbers({ github, context });

  welcome:
    needs: resolve
    if: needs.resolve.outputs.numbers != '[]'
    strategy:
      matrix:
        number: ${{ fromJSON(needs.resolve.outputs.numbers) }}
    concurrency:
      group: pr-welcome-${{ matrix.number }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/pr-welcome
        # The action must be merged into the default branch before it can welcome PRs.
        if: hashFiles('.github/actions/pr-welcome/action.yml') != ''
        with:
          bot-token: ${{ secrets.WELCOME_BOT_TOKEN }}
          bot-login: ${{ vars.WELCOME_BOT_LOGIN }}
          pr-number: ${{ matrix.number }}
