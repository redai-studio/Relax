name: GPU Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-unittest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bypass:
    name: Check CI bypass
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/check-bypass.yml
    with:
      target: gpu-unit

  unittest:
    needs: bypass
    # A failed gate must run the tests, never grant an exemption.
    if: ${{ !cancelled() && (needs.bypass.result != 'success' || needs.bypass.outputs.can-skip != 'true') }}
    name: Unit Tests (H20, 4 GPUs)
    runs-on: [self-hosted, linux, x64, h20, gpu]
    # Allow time for image preparation, device acquisition, and the 40-minute test budget.
    timeout-minutes: 190
    env:
      CI_CONTAINER_NAME: relax-unittest-${{ github.run_id }}-${{ github.run_attempt }}
      HOST_UV_CACHE_DIR: /home/relax-ci/.cache/uv
      UV_CACHE_DIR: /uv-cache
      UV_LINK_MODE: copy
    steps:
      - name: Initialize runtime paths
        run: |
          {
            echo "ARTIFACT_DIR=$RUNNER_TEMP/unittest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "KERNEL_CACHE_DIR=$RUNNER_TEMP/relax-unittest-kernels"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare local test image
        id: image
        uses: ./.github/actions/prepare-image
        timeout-minutes: 120
        with:
          dockerfile: docker/Dockerfile.cu13
          build-args: GPU_ARCH=hopper
          # Include patch targets as well as the symlinks under patch/latest.
          hash-key: ${{ hashFiles('docker/Dockerfile.cu13', '.dockerignore', 'requirements.txt', 'docker/patch/**', 'docker/scripts/**', 'relax/backends/megatron/kernels/int4_qat/**', '.github/actions/prepare-image/action.yml') }}

      - name: Identify kernel cache
        id: kernel-key
        env:
          CI_IMAGE: ${{ steps.image.outputs.image-id }}
        run: |
          set -euo pipefail
          # Include the actual driver and architecture, not just the runner label.
          hardware="$(nvidia-smi --query-gpu=name,driver_version,compute_cap --format=csv,noheader | sort -u)"
          digest="$(printf '%s\n' "$CI_IMAGE" "$hardware" | sha256sum)"
          echo "prefix=unittest-kernels-v1-${digest%% *}" >> "$GITHUB_OUTPUT"
          mkdir -p "$KERNEL_CACHE_DIR"

      - name: Restore compiled kernels
        id: kernel-cache
        uses: actions/cache/restore@v5
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: ${{ env.KERNEL_CACHE_DIR }}
          key: ${{ steps.kernel-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.kernel-key.outputs.prefix }}-

      - name: Acquire test devices
        id: devices
        uses: ./.github/actions/acquire-devices
        timeout-minutes: 35
        with:
          backend: nvidia
          count: 4
          timeout: 1800

      - name: Create test container
        env:
          CI_IMAGE: ${{ steps.image.outputs.image-id }}
          CI_DEVICES: ${{ steps.devices.outputs.devices }}
        run: |
          set -euo pipefail
          mkdir -p "$HOST_UV_CACHE_DIR" "$ARTIFACT_DIR"

          # Keep network, IPC and /tmp private for parallel Ray/NCCL tests.
          # Create before starting so cancellation during a pull cannot start tests.
          docker create --pull never --rm --init \
            --name "$CI_CONTAINER_NAME" \
            --gpus "\"device=$CI_DEVICES\"" \
            --shm-size=32g \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$ARTIFACT_DIR:/artifacts" \
            -v "$HOST_UV_CACHE_DIR:$UV_CACHE_DIR" \
            -v "$KERNEL_CACHE_DIR:/kernel-cache" \
            --workdir /workspace/Relax \
            --env TRITON_CACHE_DIR=/kernel-cache/triton \
            --env TORCHINDUCTOR_CACHE_DIR=/kernel-cache/inductor \
            --env UV_CACHE_DIR \
            --env UV_LINK_MODE \
            --env http_proxy \
            --env https_proxy \
            --env no_proxy \
            --entrypoint /bin/bash "$CI_IMAGE" -c 'sleep infinity'
          docker inspect --format 'Test image: {{.Config.Image}} ({{.Image}})' "$CI_CONTAINER_NAME"
          docker start "$CI_CONTAINER_NAME"

      - name: Prepare workspace and show GPUs
        run: |
          docker exec "$CI_CONTAINER_NAME" bash -euc '
            cp -a --no-preserve=ownership /source/. /workspace/Relax/
            nvidia-smi
          '

      - name: Install dependencies
        run: |
          docker exec "$CI_CONTAINER_NAME" uv pip install \
            --system --break-system-packages -r requirements.txt \
            --extra-index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple

      - name: Run unittest
        timeout-minutes: 40
        run: |
          docker exec "$CI_CONTAINER_NAME" bash -euo pipefail -c '
            # Batch CPU export cases without a fresh CUDA-isolated child per case.
            CUDA_VISIBLE_DEVICES= python -m pytest tests/tools/test_convert_checkpoint_to_hf_cpu.py \
              --deselect=tests/tools/test_convert_checkpoint_to_hf_cpu.py::test_cpu_export_isolates_initialized_parent \
              -v -ra --tb=short --durations=10 --junitxml=/artifacts/cpu-export.xml \
              2>&1 | tee /artifacts/cpu-export.log
            # Keep the real CUDA/Gloo parent-isolation regression on visible GPUs.
            python -m pytest \
              tests/tools/test_convert_checkpoint_to_hf_cpu.py::test_cpu_export_isolates_initialized_parent \
              -v -ra --tb=short --durations=10 --junitxml=/artifacts/cpu-export-isolation.xml \
              2>&1 | tee /artifacts/cpu-export-isolation.log
            QSA_MIXED_TEST_LOG=/artifacts/qsa-mixed.log \
              python -m pytest tests/ \
              --ignore=tests/tools/test_convert_checkpoint_to_hf_cpu.py \
              -v -ra --tb=short --durations=50 --junitxml=/artifacts/junit.xml \
              2>&1 | tee /artifacts/pytest.log
          '

      - name: Stop test container
        if: always()
        run: |
          if docker inspect "$CI_CONTAINER_NAME" >/dev/null 2>&1; then
            docker logs "$CI_CONTAINER_NAME" > "$ARTIFACT_DIR/container.log" 2>&1 || true
            docker rm --force "$CI_CONTAINER_NAME"
          fi

      - name: Restore kernel cache ownership
        if: ${{ always() && steps.kernel-key.outcome == 'success' }}
        timeout-minutes: 2
        env:
          CI_IMAGE: ${{ steps.image.outputs.image-id }}
        run: |
          # Let the runner upload and later clean up files created as container root.
          docker run --rm --network none --entrypoint /bin/chown \
            -v "$KERNEL_CACHE_DIR:/kernel-cache" "$CI_IMAGE" -R "$(id -u):$(id -g)" /kernel-cache

      - name: Save compiled kernels
        if: ${{ success() && steps.kernel-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ${{ env.KERNEL_CACHE_DIR }}
          key: ${{ steps.kernel-key.outputs.prefix }}-${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unittest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unittest-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
