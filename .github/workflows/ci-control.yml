name: CI Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-command-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  command:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Comment events must never execute scripts from the contributor's branch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/ci-control
        # During stack review, the action may not exist on the default branch yet.
        if: hashFiles('.github/actions/ci-control/action.yml') != ''
        with:
          bot-token: ${{ secrets.WELCOME_BOT_TOKEN }}
          bot-login: ${{ vars.WELCOME_BOT_LOGIN }}
