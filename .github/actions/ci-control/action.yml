name: CI Control
description: Handle Relax PR commands and lifecycle events using trusted repository code
inputs:
  bot-token:
    description: Token used to publish replies as the bot account
    required: false
  bot-login:
    description: Bot login, defaulting to the account in config.json
    required: false
runs:
  using: composite
  steps:
    - uses: actions/github-script@v8
      env:
        WELCOME_BOT_TOKEN: ${{ inputs.bot-token }}
        WELCOME_BOT_LOGIN: ${{ inputs.bot-login }}
        CI_CONTROL_PATH: ${{ github.action_path }}
      with:
        script: |
          if (!process.env.WELCOME_BOT_TOKEN) {
            core.setFailed('Configure WELCOME_BOT_TOKEN before enabling CI comments.');
            return;
          }
          const bot = new github.constructor({ auth: process.env.WELCOME_BOT_TOKEN });
          const { control } = await import(`${process.env.CI_CONTROL_PATH}/control.js`);
          await control({
            github, bot, context, core, botLogin: process.env.WELCOME_BOT_LOGIN || undefined,
          });
